<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cognix Store — abhiraj1121</title>
<meta name="description" content="Download Cognix Studio apps directly — NovaBoard and more, for Windows, Linux and Android.">

<link rel="icon" type="image/jpeg" href="photo/cognix.jpg">
<link rel="apple-touch-icon" href="photo/cognix.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="store.css">
</head>
<body class="is-loading">

<canvas id="bgCanvas" class="bg-canvas" aria-hidden="true"></canvas>

<div class="loader" id="loader" role="status" aria-label="Loading">
  <div class="loader__mark">
    <span class="loader__ring"></span>
    <span class="loader__ring loader__ring--2"></span>
    <img class="loader__glyph-img" src="photo/cognix.jpg" alt=""
         onerror="this.onerror=null;this.replaceWith(Object.assign(document.createElement('span'),{className:'loader__glyph',textContent:'C'}));">
  </div>
  <p class="loader__label">
    <span class="loader__label-text">Opening store</span><span class="loader__dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span>
  </p>
  <div class="loader__bar"><div class="loader__bar-fill" id="loaderBar"></div></div>
</div>

<div class="scanline" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="minibar" id="minibar" aria-hidden="true">
  <span class="minibar__name">Cognix Store</span>
  <a class="minibar__github" href="https://github.com/Abhiraj1121/" target="_blank" rel="noopener" aria-label="GitHub profile">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.57.1.78-.25.78-.55v-2.15c-3.2.7-3.87-1.36-3.87-1.36-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.03 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.47.11-3.06 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.77.12 3.06.74.8 1.18 1.83 1.18 3.09 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.07.78 2.15v3.19c0 .3.21.66.79.55A10.51 10.51 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5Z"/></svg>
  </a>
</div>

<main class="shell">

  <header class="identity" id="top">
    <a class="store-back" href="index.html" aria-label="Back to launchpad">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>

    <div class="identity__text">
      <p class="identity__kicker">Cognix Store</p>
      <h1 class="identity__name">
        <span class="identity__handle">Direct</span>
        <span class="identity__sep" aria-hidden="true">/</span>
        <span class="identity__studio">Downloads</span>
      </h1>
      <div class="identity__status" role="status">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-text">Releases Live</span>
        <span class="status-clock" id="clock" aria-hidden="true"></span>
      </div>
    </div>

    <a class="github-btn" href="https://github.com/Abhiraj1121/" target="_blank" rel="noopener" aria-label="Visit GitHub profile">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.57.1.78-.25.78-.55v-2.15c-3.2.7-3.87-1.36-3.87-1.36-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.03 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.47.11-3.06 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.77.12 3.06.74.8 1.18 1.83 1.18 3.09 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.07.78 2.15v3.19c0 .3.21.66.79.55A10.51 10.51 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5Z"/></svg>
      <span>GitHub</span>
    </a>
  </header>

  <section class="console" aria-label="App search">
    <div class="console__bar">
      <label class="console__label" for="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M20 20L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </label>
      <input
        type="text"
        id="storeSearch"
        class="console__input"
        placeholder="Search apps — try 'novaboard', 'windows'…"
        autocomplete="off"
        spellcheck="false"
        aria-controls="appGrid"
      >
      <span class="console__count" id="storeResultCount" aria-live="polite">0 apps</span>
    </div>

    <!-- App cards render here via store.js, from the APPS array -->
    <div class="app-grid" id="appGrid"></div>

    <p class="empty-state" id="storeEmptyState" hidden>No apps match "<span id="storeEmptyQuery"></span>".</p>
  </section>

  <footer class="site-footer">
    <span>© <span id="year"></span> abhiraj1121 / Cognix Studio</span>
    <span class="site-footer__dot" aria-hidden="true">•</span>
    <span>Direct downloads, no repo browsing required</span>
  </footer>

</main>

<script src="script.js"></script>
<script src="store.js"></script>
</body>
</html>
