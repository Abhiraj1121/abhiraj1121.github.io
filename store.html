<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cognix Store — abhiraj1121</title>
<meta name="description" content="Download Cognix Studio apps directly — NovaBoard and more, for Windows, Linux and Android.">
<meta name="theme-color" content="#0b0a12">
<link rel="icon" type="image/jpeg" href="photo/cognix.jpg">
<link rel="apple-touch-icon" href="photo/cognix.jpg">
<script>
/* apply saved/system theme before first paint (no flash) */
(function(){try{var t=localStorage.getItem("theme");if(!t)t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t;}catch(e){}})();
</script>
<script>
/* image fallbacks — defined early so onerror handlers always find them */
window.__fallbackAvatar=function(){var e=document.createElement("div");e.className="hero__avatar fallback-badge";e.style.cssText="width:104px;height:104px;font-size:34px";e.textContent="A";return e;};
window.__fallbackBadge=function(){var e=document.createElement("div");e.className="hero__badge fallback-badge";e.style.cssText="width:40px;height:40px;font-size:14px";e.textContent="C";return e;};
window.__iconFallback=function(l){var m={mini:"EM",ai:"AI",about:"AM"},e=document.createElement("span");e.className="fallback-icon";e.textContent=m[l]||"?";return e;};
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="store.css">
</head>
<body class="is-loading" data-page="store">

<div class="backdrop" aria-hidden="true"><i></i><i></i><i></i></div>

<!-- ============ Loader ============ -->
<div class="loader" id="loader" role="status" aria-label="Loading">
  <div class="loader__stage">
    <span class="loader__shape"></span><span class="loader__shape loader__shape--2"></span><span class="loader__shape loader__shape--3"></span>
    <span class="loader__orbit"></span>
    <span class="loader__core"><img src="photo/cognix-icon-transparent.png" alt="" onerror="this.onerror=null;this.replaceWith(document.createTextNode('C'));"></span>
  </div>
  <div class="loader__info">
    <span class="loader__pct"><span id="loaderPct">0</span>%</span>
    <div class="loader__bar"><div class="loader__bar-fill" id="loaderBar"></div></div>
    <span class="loader__label">Opening store</span>
  </div>
</div>

<!-- ============ Floating dock ============ -->
<nav class="dock" id="dock" aria-label="Primary">
  <a class="dock__brand" href="index.html" aria-label="Cognix home">
    <img src="photo/cognix-icon-transparent.png" alt="" width="32" height="32" onerror="this.onerror=null;this.replaceWith(Object.assign(document.createElement('span'),{className:'fallback-badge',textContent:'C'}));">
    <span>Cognix</span>
  </a>
  <div class="dock__links">
    <a class="dock__link" href="index.html"><svg viewBox="0 0 24 24" fill="none"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Home</span></a>
    <a class="dock__link" href="index.html#projects"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7.5" height="7.5" rx="2" stroke="currentColor" stroke-width="1.8"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2" stroke="currentColor" stroke-width="1.8"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2" stroke="currentColor" stroke-width="1.8"/></svg><span>Projects</span></a>
  </div>
  <span class="dock__spacer"></span>
  <a class="dock__store is-active" href="store.html"><svg viewBox="0 0 24 24" fill="none"><path d="M4 9l1.5-5h13L20 9M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9M4 9h16M9 13a2 2 0 1 0 4 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Store</span></a>
  <a class="icon-btn" href="https://github.com/Abhiraj1121/" target="_blank" rel="noopener" aria-label="GitHub profile"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.57.1.78-.25.78-.55v-2.15c-3.2.7-3.87-1.36-3.87-1.36-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.03 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.47.11-3.06 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.77.12 3.06.74.8 1.18 1.83 1.18 3.09 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.07.78 2.15v3.19c0 .3.21.66.79.55A10.51 10.51 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5Z"/></svg></a>
  <button class="icon-btn theme-toggle" id="themeToggle" type="button" aria-label="Toggle light / dark theme">
    <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
  </button>
</nav>
<main class="shell">

  <header class="hero" id="top">
    <div class="hero__text">
      <p class="kicker">Cognix Store</p>
      <h1 class="hero__name"><span>Direct</span><span class="sep" aria-hidden="true">/</span><span class="studio">Downloads</span></h1>
      <div class="chips">
        <span class="chip" role="status"><span class="status-dot" aria-hidden="true"></span>Releases Live</span>
        <span class="chip"><span class="clock" id="clock" aria-hidden="true"></span></span>
      </div>
    </div>
    <div class="hero__portrait" style="justify-self:end">
      <img class="hero__avatar" src="photo/cognix.jpg" alt="Cognix Store" width="104" height="104"
           onerror="this.onerror=null;var f=window.__fallbackAvatar();f.textContent='C';this.replaceWith(f);">
    </div>
  </header>

  <section class="console" aria-label="App search">
    <div class="console__bar">
      <label class="console__label" for="storeSearch">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </label>
      <input type="text" id="storeSearch" class="console__input" placeholder="Search apps — try 'novaboard', 'windows'…" autocomplete="off" spellcheck="false" aria-controls="appGrid">
      <span class="console__count" id="storeResultCount" aria-live="polite">0 apps</span>
    </div>

    <div class="filters" id="filters" role="group" aria-label="Filter by platform"></div>

    <!-- App cards render here via store.js, from the APPS array -->
    <div class="app-grid" id="appGrid"></div>

    <p class="empty-state" id="storeEmptyState" hidden>No apps match "<span id="storeEmptyQuery"></span>".</p>
  </section>

  <footer class="site-footer">
    <span>© <span id="year"></span> abhiraj1121 / Cognix Studio</span>
    <span class="site-footer__dot" aria-hidden="true">•</span>
    <span>Direct downloads, no repo browsing required</span>
  </footer>

</main>

<script src="script.js"></script>
<script src="store.js"></script>
</body>
</html>
