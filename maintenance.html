<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance | System Paused — Abhi Raj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #030712;
  --surface: rgba(15, 23, 42, 0.55);
  --surface-border: rgba(148, 163, 184, 0.12);
  --text: #f1f5f9;
  --text-dim: #94a3b8;
  --accent: #3b82f6;
  --accent-soft: rgba(59, 130, 246, 0.35);
  --accent-bright: #60a5fa;
  --amber: #f59e0b;
  --green: #10b981;
  --red: #ef4444;
  --font-ui: 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  display: grid;
  place-items: center;
  position: relative;
  perspective: 1200px;
}

/* Ambient glow orbs */
.ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.35; animation: floatOrb 18s ease-in-out infinite; }
.orb-1 { width: 420px; height: 420px; background: radial-gradient(circle, var(--accent) 0%, transparent 70%); top: -120px; left: -80px; }
.orb-2 { width: 360px; height: 360px; background: radial-gradient(circle, #8b5cf6 0%, transparent 70%); bottom: -100px; right: -60px; animation-delay: -7s; }
.orb-3 { width: 280px; height: 280px; background: radial-gradient(circle, var(--amber) 0%, transparent 70%); top: 40%; left: 55%; animation-delay: -12s; opacity: 0.16; }
@keyframes floatOrb {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(30px, -40px) scale(1.05); }
  66% { transform: translate(-20px, 25px) scale(0.95); }
}

#network { position: fixed; inset: 0; z-index: 1; opacity: 0.85; }

.scene { position: relative; z-index: 2; width: min(92vw, 680px); transform-style: preserve-3d; transition: transform 0.15s ease-out; }

.card {
  position: relative;
  padding: 3.1rem 2.75rem;
  background: var(--surface);
  backdrop-filter: blur(24px) saturate(140%);
  -webkit-backdrop-filter: blur(24px) saturate(140%);
  border: 1px solid var(--surface-border);
  border-radius: 28px;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.04) inset, 0 1px 0 rgba(255, 255, 255, 0.08) inset;
  text-align: center;
  transform-style: preserve-3d;
  animation: cardEnter 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  opacity: 0;
}
@keyframes cardEnter {
  from { opacity: 0; transform: translateY(40px) rotateX(8deg); }
  to { opacity: 1; transform: translateY(0) rotateX(0); }
}

/* Plug / disconnected socket visual */
.plug-scene { width: 240px; height: 100px; margin: 0 auto 1.6rem; position: relative; }
.plug-scene svg { width: 100%; height: 100%; overflow: visible; }
.prong-left { animation: pullLeft 3.2s ease-in-out infinite; transform-origin: center; }
.prong-right { animation: pullRight 3.2s ease-in-out infinite; transform-origin: center; }
@keyframes pullLeft { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-8px); } }
@keyframes pullRight { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(8px); } }
.spark { animation: sparkFlicker 3.2s ease-in-out infinite; }
.spark.s2 { animation-delay: 0.15s; }
.spark.s3 { animation-delay: 0.3s; }
@keyframes sparkFlicker {
  0%, 38%, 100% { opacity: 0; transform: scale(0.6); }
  46% { opacity: 1; transform: scale(1.15); }
  54% { opacity: 0.3; transform: scale(0.9); }
  60% { opacity: 0; transform: scale(0.6); }
}
.gap-glow { animation: gapPulse 3.2s ease-in-out infinite; }
@keyframes gapPulse { 0%, 40%, 100% { opacity: 0.12; } 50% { opacity: 0.5; } }

h2 { font-size: 1.35rem; font-weight: 600; letter-spacing: -0.02em; color: #e2e8f0; margin-bottom: 0.65rem; }
.subtitle { color: var(--text-dim); font-size: 1.02rem; line-height: 1.65; max-width: 460px; margin: 0 auto 2rem; }

.terminal {
  background: rgba(2, 6, 23, 0.75);
  border: 1px solid rgba(148, 163, 184, 0.1);
  border-radius: 14px;
  padding: 1.15rem 1.3rem;
  font-family: var(--font-mono);
  font-size: 0.82rem;
  text-align: left;
  margin-bottom: 2.1rem;
  min-height: 118px;
  box-shadow: inset 0 2px 12px rgba(0, 0, 0, 0.45);
  position: relative;
  overflow: hidden;
}
.terminal::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.4), transparent);
}
.terminal-line { margin-bottom: 0.38rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; }
.prompt { color: var(--green); margin-right: 0.45rem; }
.warn { color: var(--amber); }
.cursor { display: inline-block; width: 7px; height: 14px; background: var(--text); vertical-align: middle; margin-left: 2px; animation: blink 1.05s step-end infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

.actions { display: flex; gap: 0.9rem; justify-content: center; flex-wrap: wrap; }
.btn {
  text-decoration: none; border: none; cursor: pointer;
  padding: 0.85rem 1.7rem; border-radius: 12px; font-weight: 600; font-size: 0.92rem;
  display: inline-flex; align-items: center; gap: 0.5rem;
  transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden;
  font-family: var(--font-ui);
}
.btn svg { flex-shrink: 0; }
.btn-primary {
  background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; border: 1px solid transparent;
  box-shadow: 0 0 24px var(--accent-soft), 0 4px 12px rgba(37, 99, 235, 0.25);
}
.btn-primary:hover { transform: translateY(-3px); box-shadow: 0 0 36px rgba(59, 130, 246, 0.55), 0 8px 20px rgba(37, 99, 235, 0.35); background: linear-gradient(135deg, #60a5fa, #3b82f6); }
.btn-primary:active { transform: translateY(-1px); }
.btn-primary.is-loading svg { animation: spin 0.8s linear infinite; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.btn-secondary { background: rgba(255, 255, 255, 0.03); color: var(--text); border: 1px solid rgba(255, 255, 255, 0.12); }
.btn-secondary:hover { background: rgba(255, 255, 255, 0.07); border-color: rgba(255, 255, 255, 0.22); transform: translateY(-3px); }

.status {
  display: inline-flex; align-items: center; gap: 0.4rem;
  font-size: 0.72rem; font-weight: 500; color: var(--text-dim); letter-spacing: 0.04em; text-transform: uppercase;
  margin-bottom: 1.4rem; padding: 0.3rem 0.75rem; border-radius: 999px;
  background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.22);
}
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.85); } }

@media (max-width: 600px) {
  .card { padding: 2.25rem 1.5rem; border-radius: 22px; }
  h2 { font-size: 1.2rem; }
  .actions { flex-direction: column; }
  .btn { width: 100%; justify-content: center; }
  .terminal { font-size: 0.75rem; min-height: 110px; }
  .plug-scene { width: 200px; height: 84px; }
}
@media (prefers-reduced-motion: reduce) {
  *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}
</style>
</head>
<body>

<div class="ambient">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<canvas id="network"></canvas>

<div class="scene" id="scene">
  <div class="card" id="card">

    <div class="status"><span class="status-dot"></span> System Offline</div>

    <div class="plug-scene">
      <svg viewBox="0 0 240 100" xmlns="http://www.w3.org/2000/svg">
        <ellipse class="gap-glow" cx="120" cy="50" rx="32" ry="17" fill="rgba(59,130,246,0.4)" />

        <g class="prong-left">
          <path d="M0 50 C 32 50, 42 36, 64 36" stroke="#1e293b" stroke-width="10" stroke-linecap="round" fill="none"/>
          <path d="M0 50 C 32 50, 42 36, 64 36" stroke="#334155" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
          <rect x="58" y="24" width="32" height="24" rx="6" fill="url(#plugBody)" stroke="var(--accent)" stroke-width="1.5"/>
          <rect x="84" y="30" width="12" height="5" rx="2" fill="var(--accent-bright)"/>
          <rect x="84" y="39" width="12" height="5" rx="2" fill="var(--accent-bright)"/>
        </g>

        <g class="prong-right">
          <path d="M240 50 C 208 50, 196 60, 176 60" stroke="#0f172a" stroke-width="12" stroke-linecap="round" fill="none"/>
          <path d="M240 50 C 208 50, 196 60, 176 60" stroke="#1e293b" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.5"/>
          <rect x="142" y="46" width="34" height="30" rx="7" fill="url(#socketBody)" stroke="rgba(148,163,184,0.35)" stroke-width="1.5"/>
          <rect x="148" y="54" width="8" height="6" rx="2" fill="#030712"/>
          <rect x="162" y="54" width="8" height="6" rx="2" fill="#030712"/>
        </g>

        <g stroke="var(--accent-bright)" stroke-width="2" stroke-linecap="round">
          <path class="spark s1" d="M108 42 L116 36 M116 36 L112 46 M112 46 L120 42"/>
          <path class="spark s2" d="M128 58 L122 52 M122 52 L130 54 M130 54 L124 62"/>
          <path class="spark s3" d="M114 56 L106 54"/>
        </g>

        <defs>
          <linearGradient id="plugBody" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1e293b"/>
            <stop offset="1" stop-color="#0f172a"/>
          </linearGradient>
          <linearGradient id="socketBody" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1e2536"/>
            <stop offset="1" stop-color="#0b1220"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <h2>Node Disconnected For Maintenance</h2>
    <p class="subtitle">
      This part of the EkaDev mesh has been unplugged for a scheduled tune-up.
      Nothing's broken — we're just working on it. Check back shortly.
    </p>

    <div class="terminal" id="terminal"></div>

    <div class="actions">
      <button class="btn btn-primary" id="reloadBtn" type="button" onclick="reloadPage()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 4v6h-6"/>
          <path d="M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
        <span id="reloadLabel">Reconnect</span>
      </button>
      <a href="https://github.com/Abhiraj1121" class="btn btn-secondary" target="_blank" rel="noopener">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/>
          <path d="M9 18c-4.51 2-5-2-7-2"/>
        </svg>
        GitHub Logs
      </a>
    </div>
  </div>
</div>

<script>
function reloadPage(){
  const btn = document.getElementById('reloadBtn');
  const label = document.getElementById('reloadLabel');
  btn.classList.add('is-loading');
  label.textContent = 'Reconnecting…';
  btn.disabled = true;
  setTimeout(() => { window.location.reload(); }, 550);
}

// Terminal typing effect
const lines = [
  { html: `<span class="prompt">root@cognix-studio:~#</span> systemctl status mesh` },
  { html: `[SYS] Node taken offline for maintenance…` },
  { html: `<span class="warn">[WARN] Manual hold active — service paused by operator.</span>` },
  { html: `[SYS] No ETA set. Reconnect to poll status.` }
];
const terminal = document.getElementById('terminal');
let lineIndex = 0;
function typeNext() {
  if (lineIndex >= lines.length) return;
  const row = document.createElement('div');
  row.className = 'terminal-line';
  row.innerHTML = lines[lineIndex].html + '<span class="cursor"></span>';
  terminal.appendChild(row);
  const cursors = terminal.querySelectorAll('.cursor');
  if (cursors.length > 1) cursors[0].remove();
  lineIndex++;
  setTimeout(typeNext, 520 + Math.random() * 380);
}
setTimeout(typeNext, 700);

// Interactive neural particle network
const canvas = document.getElementById('network');
const ctx = canvas.getContext('2d');
let W, H, particles = [], mouse = { x: null, y: null, radius: 140 };
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; initParticles(); }
class Particle {
  constructor() {
    this.x = Math.random() * W; this.y = Math.random() * H;
    this.vx = (Math.random() - 0.5) * 0.55; this.vy = (Math.random() - 0.5) * 0.55;
    this.r = Math.random() * 1.8 + 0.8; this.baseAlpha = Math.random() * 0.35 + 0.25;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    if (this.x < 0 || this.x > W) this.vx *= -1;
    if (this.y < 0 || this.y > H) this.vy *= -1;
    if (mouse.x !== null) {
      const dx = mouse.x - this.x, dy = mouse.y - this.y, dist = Math.hypot(dx, dy);
      if (dist < mouse.radius) {
        const force = (mouse.radius - dist) / mouse.radius;
        this.vx -= (dx / dist) * force * 0.04;
        this.vy -= (dy / dist) * force * 0.04;
      }
    }
    this.vx *= 0.995; this.vy *= 0.995;
  }
  draw() {
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(148, 163, 184, ${this.baseAlpha})`; ctx.fill();
  }
}
function initParticles() {
  particles = [];
  const count = Math.min(160, Math.max(45, Math.floor((W * H) / 14000)));
  for (let i = 0; i < count; i++) particles.push(new Particle());
}
function drawConnections() {
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, dist = Math.hypot(dx, dy);
      if (dist < 130) {
        const alpha = 0.22 - dist / 600;
        ctx.beginPath(); ctx.strokeStyle = `rgba(59, 130, 246, ${alpha})`; ctx.lineWidth = 1;
        ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke();
      }
    }
    if (mouse.x !== null) {
      const dx = particles[i].x - mouse.x, dy = particles[i].y - mouse.y, dist = Math.hypot(dx, dy);
      if (dist < mouse.radius) {
        const alpha = 0.35 * (1 - dist / mouse.radius);
        ctx.beginPath(); ctx.strokeStyle = `rgba(96, 165, 250, ${alpha})`; ctx.lineWidth = 1.2;
        ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
      }
    }
  }
}
function animate() {
  ctx.clearRect(0, 0, W, H);
  for (const p of particles) { p.update(); p.draw(); }
  drawConnections();
  requestAnimationFrame(animate);
}
window.addEventListener('resize', resize);
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });
window.addEventListener('touchmove', e => { if (e.touches[0]) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; } }, { passive: true });
resize();
animate();

// 3D tilt / parallax on the card
const scene = document.getElementById('scene');
let targetRX = 0, targetRY = 0, currentRX = 0, currentRY = 0;
window.addEventListener('mousemove', e => {
  const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
  const dx = (e.clientX - cx) / cx, dy = (e.clientY - cy) / cy;
  targetRY = dx * 9; targetRX = -dy * 7;
});
window.addEventListener('mouseleave', () => { targetRX = 0; targetRY = 0; });
function tiltLoop() {
  currentRX += (targetRX - currentRX) * 0.08;
  currentRY += (targetRY - currentRY) * 0.08;
  scene.style.transform = `rotateX(${currentRX}deg) rotateY(${currentRY}deg)`;
  requestAnimationFrame(tiltLoop);
}
tiltLoop();
</script>

</body>
</html>
