<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Under maintenance · abhiraj1121</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1638; --violet:#2d2566; --plum:#4a2f78;
  --peach:#ffb88a; --mint:#8ff0d4; --cloud:#f1ecff; --steel:#5a6eaa;
  --tilt-x:0deg; --tilt-y:0deg;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--cloud);
  background:
    radial-gradient(1200px 700px at 50% 38%, #3b2f80 0%, transparent 70%),
    radial-gradient(900px 500px at 50% 110%, #6a3a7d 0%, transparent 70%),
    linear-gradient(180deg,var(--ink),#241d52 60%,#2d2058);
  overflow:hidden;
}
/* soft starfield */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 20%,#fff 50%,transparent 51%),
    radial-gradient(1px 1px at 78% 14%,#fff 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 88% 62%,#cfc3ff 50%,transparent 51%),
    radial-gradient(1px 1px at 24% 70%,#fff 50%,transparent 51%),
    radial-gradient(1px 1px at 55% 8%,#cfc3ff 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 6% 52%,#fff 50%,transparent 51%),
    radial-gradient(1px 1px at 66% 36%,#fff 50%,transparent 51%);
  animation:twinkle 6s ease-in-out infinite alternate;
}
@keyframes twinkle{to{opacity:.25}}

.brand{position:fixed;top:22px;left:26px;font-weight:700;font-size:15px;letter-spacing:.01em;opacity:.8;z-index:5}

.stage{position:fixed;inset:0;perspective:1700px;perspective-origin:50% 40%}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;
  transform:rotateX(var(--tilt-x)) rotateY(var(--tilt-y));transition:transform .5s ease-out}
.scaler{position:absolute;left:50%;top:41%;width:0;height:0;transform-style:preserve-3d;transform:scale(var(--s,1))}
.world{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;animation:sway 16s ease-in-out infinite alternate}
@keyframes sway{
  from{transform:rotateX(-17deg) rotateY(-26deg)}
  to{transform:rotateX(-13deg) rotateY(26deg)}
}
.g{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}

/* ---------- 3D box ---------- */
.box{position:absolute;left:0;top:0;transform-style:preserve-3d}
.face{position:absolute;background:var(--c);backface-visibility:hidden;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.f-front{filter:brightness(1)}
.f-back{filter:brightness(.62)}
.f-right{filter:brightness(.8)}
.f-left{filter:brightness(.7)}
.f-top{filter:brightness(1.22)}
.f-bottom{filter:brightness(.5)}
.flat{position:absolute;transform-style:preserve-3d}

/* ---------- floor ---------- */
.floor{position:absolute;width:620px;height:620px;margin:-310px 0 0 -310px;border-radius:50%;
  transform:translateY(152px) rotateX(90deg);
  background:radial-gradient(circle,rgba(143,240,212,.22) 0 26%,rgba(255,184,138,.12) 27% 52%,rgba(255,255,255,.04) 53% 100%);
  box-shadow:0 0 90px rgba(143,240,212,.18);
}
.floor::before,.floor::after{content:"";position:absolute;border-radius:50%}
.floor::before{inset:14px;border:2px dashed rgba(241,236,255,.35);animation:spin 40s linear infinite}
.floor::after{inset:90px;border:2px solid rgba(255,184,138,.35)}
.shadow{position:absolute;width:190px;height:190px;margin:-95px 0 0 -95px;border-radius:50%;
  background:radial-gradient(circle,rgba(10,6,30,.55),transparent 68%);
  transform:translateY(151px) rotateX(90deg);}
.shadow.bot{animation:shadow 3.2s ease-in-out infinite}
@keyframes shadow{50%{transform:translateY(151px) rotateX(90deg) scale(.82);opacity:.7}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- engine ---------- */
.piston{animation:piston 1.2s ease-in-out infinite}
.piston:nth-child(2){animation-delay:-.4s}
.piston:nth-child(3){animation-delay:-.8s}
@keyframes piston{0%,100%{transform:translateY(0)}50%{transform:translateY(16px)}}
.engine-shake{animation:shake .24s linear infinite}
@keyframes shake{0%{transform:translate3d(0,0,0)}25%{transform:translate3d(.8px,-.6px,0)}50%{transform:translate3d(-.6px,.5px,0)}75%{transform:translate3d(.5px,.7px,0)}100%{transform:translate3d(0,0,0)}}

.fly{width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;
  background:radial-gradient(circle,#2a2358 0 14%,transparent 15%),
    repeating-conic-gradient(#7b8fd0 0 18deg,#4e5f99 18deg 36deg);
  border:7px solid #98a9e0;animation:spin 1.6s linear infinite;
  box-shadow:inset 0 0 0 6px #3a4880}
.gear{border-radius:50%;
  background:radial-gradient(circle,var(--peach) 0 58%,transparent 59%),
    repeating-conic-gradient(var(--peach) 0 11deg,transparent 11deg 22deg);
  -webkit-mask:radial-gradient(circle,#000 0 70%,transparent 71%);mask:radial-gradient(circle,#000 0 70%,transparent 71%);
  animation:spin 3s linear infinite;position:relative}
.gear::after{content:"";position:absolute;inset:36%;border-radius:50%;background:#2a2358;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.gear.rev{animation:spin 4.4s linear infinite reverse}

/* ---------- bot ---------- */
.float{animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(9px)}}
.arm-r{animation:armR 1.2s ease-in-out infinite;transform-origin:0 0}
@keyframes armR{
  0%,100%{transform:rotateX(26deg) rotateZ(-4deg)}
  50%{transform:rotateX(34deg) rotateZ(24deg)}
}
.arm-l{animation:armL 2.4s ease-in-out infinite;transform-origin:0 0}
@keyframes armL{
  0%,100%{transform:rotateX(24deg) rotateZ(10deg)}
  50%{transform:rotateX(34deg) rotateZ(26deg)}
}
.wrench{animation:twist 1.2s ease-in-out infinite}
@keyframes twist{0%,100%{transform:rotateZ(-14deg)}50%{transform:rotateZ(18deg)}}
.visor{width:58px;height:32px;margin:-16px 0 0 -29px;border-radius:12px;
  background:linear-gradient(160deg,#241d52,#14102f);box-shadow:0 0 0 2px rgba(255,255,255,.35),inset 0 0 12px rgba(143,240,212,.25)}
.eye{position:absolute;top:9px;width:10px;height:14px;border-radius:5px;background:var(--mint);
  box-shadow:0 0 10px var(--mint);animation:blink 4.6s infinite}
.eye.a{left:15px}.eye.b{right:15px}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.core{width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;
  background:radial-gradient(circle,#fff,var(--mint) 50%,#35b898);box-shadow:0 0 14px var(--mint);animation:pulse 1.6s ease-in-out infinite}
.core::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(143,240,212,.5)}
.bulb{width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff,var(--peach) 55%,#e0764a);box-shadow:0 0 16px var(--peach);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{filter:brightness(1.5);transform:scale(1.12)}}
.hand{width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b9acf0)}

/* sparks */
.spark{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;
  background:var(--peach);box-shadow:0 0 10px 2px var(--peach);opacity:0;animation:spark 1.2s ease-out infinite}
@keyframes spark{
  0%,48%{opacity:0;transform:translate3d(0,0,0)}
  50%{opacity:1}
  100%{opacity:0;transform:translate3d(var(--dx),var(--dy),var(--dz))}
}
/* steam */
.puff{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
  background:radial-gradient(circle,rgba(241,236,255,.5),transparent 70%);opacity:0;animation:puff 3.2s ease-out infinite}
@keyframes puff{0%{opacity:0;transform:translate3d(0,0,0) scale(.5)}20%{opacity:.8}100%{opacity:0;transform:translate3d(-20px,-110px,10px) scale(2.4)}}

/* ---------- copy ---------- */
.copy{position:fixed;left:0;right:0;bottom:clamp(24px,6vh,60px);text-align:center;padding:0 24px;z-index:5}
.chip{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;
  background:rgba(241,236,255,.09);border:1px solid rgba(241,236,255,.18);font-size:14px;font-weight:400;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 0 rgba(143,240,212,.7);animation:ping 1.8s infinite}
@keyframes ping{to{box-shadow:0 0 0 12px rgba(143,240,212,0)}}
h1{margin-top:16px;font-size:clamp(30px,5.2vw,58px);line-height:1.02;font-weight:800;letter-spacing:-.025em;
  font-variation-settings:"opsz" 96}
p{margin:14px auto 0;max-width:46ch;font-size:clamp(15px,1.7vw,18px);line-height:1.55;color:rgba(241,236,255,.74)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>

</section>

<script>
/* build 3D boxes from data attributes */
document.querySelectorAll('.box').forEach(function(b){
  var w=+b.dataset.w,h=+b.dataset.h,d=+b.dataset.d,p=b.dataset.p.split(',').map(Number);
  b.style.setProperty('--c',b.dataset.c);
  b.style.transform='translate3d('+(p[0]-w/2)+'px,'+(p[1]-h/2)+'px,'+p[2]+'px)';
  var f=[
    ['front',w,h,0,0,'translateZ('+d/2+'px)'],
    ['back',w,h,0,0,'rotateY(180deg) translateZ('+d/2+'px)'],
    ['right',d,h,(w-d)/2,0,'rotateY(90deg) translateZ('+w/2+'px)'],
    ['left',d,h,(w-d)/2,0,'rotateY(-90deg) translateZ('+w/2+'px)'],
    ['top',w,d,0,(h-d)/2,'rotateX(90deg) translateZ('+h/2+'px)'],
    ['bottom',w,d,0,(h-d)/2,'rotateX(-90deg) translateZ('+h/2+'px)']
  ];
  f.forEach(function(x){
    var e=document.createElement('div');
    e.className='face f-'+x[0];
    e.style.cssText='width:'+x[1]+'px;height:'+x[2]+'px;left:'+x[3]+'px;top:'+x[4]+'px;transform:'+x[5];
    b.appendChild(e);
  });
});

/* responsive scale + gentle mouse parallax */
var scaler=document.getElementById('scaler'),tilt=document.getElementById('tilt');
function fit(){
  var s=Math.min(innerWidth/780,(innerHeight*0.6)/430);
  scaler.style.setProperty('--s',Math.max(.45,Math.min(1.5,s)).toFixed(3));
}
fit();addEventListener('resize',fit);
addEventListener('pointermove',function(e){
  var x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;
  tilt.style.setProperty('--tilt-y',(x*10)+'deg');
  tilt.style.setProperty('--tilt-x',(-y*7)+'deg');
});
</script>
